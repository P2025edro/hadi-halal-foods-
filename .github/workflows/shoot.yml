name: screenshot-live
on:
  push:
    branches: [qa-tools]
    paths: [tools/shoot.mjs, tools/trigger.txt, .github/workflows/shoot.yml]
permissions:
  contents: write
jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - run: mkdir -p out && node tools/shoot.mjs > out/run.txt 2>&1 || true
      - if: always()
        run: |
          cd out && git init -q -b qa-shots && git config user.name qa-bot && git config user.email qa-bot@users.noreply.github.com
          git add -A && git commit -qm "live screenshots" && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" qa-shots
