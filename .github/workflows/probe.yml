name: probe
on:
  push:
    branches: [qa-tools]
    paths: [tools/probe.sh, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/probe.sh > probe-log.txt 2>&1 || true; mkdir -p out; mv probe-log.txt out/
      - if: always()
        run: |
          cd out && git init -q -b qa-probe && git config user.name qa-bot && git config user.email qa-bot@users.noreply.github.com
          git add -A && git commit -qm probe && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" qa-probe
