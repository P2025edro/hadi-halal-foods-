name: photo-research
on:
  push:
    branches: [qa-tools]
    paths: [tools/queries.json, tools/search.py, .github/workflows/research.yml]
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow
      - run: python tools/search.py
      - name: Publish results to qa-out
        run: |
          cd out
          git init -q -b qa-out
          git config user.name qa-bot; git config user.email qa-bot@users.noreply.github.com
          git add -A && git commit -qm "photo research ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" qa-out
