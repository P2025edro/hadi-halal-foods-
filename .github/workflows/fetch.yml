name: fetch-photos
on:
  push:
    branches: [qa-tools]
    paths: [tools/selection.json, tools/fetch.py, .github/workflows/fetch.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow
      - run: mkdir -p out && python tools/fetch.py > out/run.txt 2>&1
      - name: Publish to qa-photos
        if: always()
        run: |
          cd out
          git init -q -b qa-photos
          git config user.name qa-bot; git config user.email qa-bot@users.noreply.github.com
          git add -A && git commit -qm "selected photos ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" qa-photos
